<script>
(function() {
  const size = 180;
  const c = document.createElement("canvas");
  c.width = c.height = size;
  const ctx = c.getContext("2d");

  // Dark rounded background (roundRect not supported on older iOS)
  ctx.fillStyle = "#1a1a1a";
  ctx.beginPath();
  const r = 36;
  ctx.moveTo(r, 0);
  ctx.lineTo(size - r, 0);
  ctx.quadraticCurveTo(size, 0, size, r);
  ctx.lineTo(size, size - r);
  ctx.quadraticCurveTo(size, size, size - r, size);
  ctx.lineTo(r, size);
  ctx.quadraticCurveTo(0, size, 0, size - r);
  ctx.lineTo(0, r);
  ctx.quadraticCurveTo(0, 0, r, 0);
  ctx.closePath();
  ctx.fill();

  // Kettlebell ball
  ctx.beginPath();
  ctx.arc(90, 108, 48, 0, Math.PI * 2);
  ctx.fillStyle = "#e85d3a";
  ctx.fill();

  // Kettlebell handle arc
  ctx.beginPath();
  ctx.arc(90, 76, 26, Math.PI, 0, false);
  ctx.strokeStyle = "#e85d3a";
  ctx.lineWidth = 14;
  ctx.lineCap = "butt";
  ctx.stroke();

  // Handle side connectors (left & right)
  ctx.fillStyle = "#e85d3a";
  ctx.fillRect(63, 76, 14, 22);
  ctx.fillRect(103, 76, 14, 22);

  // Initials
  ctx.fillStyle = "#f7f4ef";
  ctx.font = "bold 22px Georgia, serif";
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.fillText("BB", 90, 110);

  // Inject apple touch icon
  const link = document.createElement("link");
  link.rel = "apple-touch-icon";
  link.href = c.toDataURL("image/png");
  document.head.appendChild(link);

  // Favicon
  const fav = document.createElement("link");
  fav.rel = "icon";
  fav.href = c.toDataURL("image/png");
  document.head.appendChild(fav);
})();

function getDayData() {
  const pool = currentDays === 3 ? DAYS.slice(0,3) : DAYS;
  return pool.find(d => d.id === currentDayId) || pool[0];
}

// ── RENDER ───────────────────────────────────────────────────────────────────

function setDays(n) {
  currentDays  = n;
  currentDayId = "A";
  currentBlock = 0;
  document.getElementById("btn3").classList.toggle("active", n === 3);
  document.getElementById("btn4").classList.toggle("active", n === 4);
  render();
}

function setDay(id) {
  currentDayId = id;
  currentBlock = 0;
  render();
}

function setBlock(i) {
  currentBlock = i;
  renderDayContent();
}

function render() {
  const day = getDayData();
  updateAccentColor(day.accent);
  renderScheduleStrip();
  renderDayTabs();
  renderDayContent();
  renderProgression();
  renderPrinciples();
}

function updateAccentColor(accent) {
  document.getElementById("title-full").style.color = accent;
  document.querySelectorAll(".toggle-btn.active").forEach(b => {
    b.style.background = accent;
    b.style.borderColor = accent;
  });
}

function renderScheduleStrip() {
  document.getElementById("sched-label").textContent = currentDays + "-DAY WEEKLY SCHEDULE";
  const tags = document.getElementById("schedule-tags");
  tags.innerHTML = "";
  SCHEDULES[currentDays].forEach(item => {
    const div = document.createElement("div");
    const isKB = item.includes("Day");
    div.className = "schedule-tag " + (isKB ? "kb" : "other");
    div.textContent = item;
    tags.appendChild(div);
  });
}

function renderDayTabs() {
  const pool = currentDays === 3 ? DAYS.slice(0,3) : DAYS;
  const day  = getDayData();
  const container = document.getElementById("day-tabs");
  container.innerHTML = "";
  pool.forEach(d => {
    const btn = document.createElement("button");
    btn.className = "day-tab" + (d.id === currentDayId ? " active" : "");
    btn.style.borderBottomColor = d.id === currentDayId ? d.accent : "transparent";
    btn.innerHTML = `<div class="tab-label" style="color:${d.id===currentDayId?d.accent:'#999'}">${d.label}</div>
                     <div class="tab-theme">${d.theme}</div>`;
    btn.onclick = () => setDay(d.id);
    container.appendChild(btn);
  });
}

function renderDayContent() {
  const day = getDayData();
  const container = document.getElementById("day-content");

  // Warmup HTML
  const warmupItems = day.warmup.map((w, i) => `
    <div class="warmup-item">
      <span class="warmup-num" style="color:${day.accent}">${String(i+1).padStart(2,"0")}</span>
      <span class="warmup-text">${w}</span>
    </div>`).join("");

  // Block tabs HTML
  const blockTabs = day.blocks.map((b, i) => `
    <button class="block-tab${i===currentBlock?" active":""}"
      style="${i===currentBlock?"background:"+day.accent+";color:#1a1a1a;border-color:"+day.accent:"background:#ede9e2"}"
      onclick="setBlock(${i})">${b.name}</button>`).join("");

  // Exercises HTML
  const block = day.blocks[currentBlock];
  let exNum = 0;
  const exerciseRows = block.sets.map((s, i) => {
    const isSub = s.exercise.startsWith("  →");
    if (!isSub) exNum++;
    const rowClass = `exercise-row ${i%2===0?"even":"odd"}${isSub?" subitem":""}`;

    if (isSub) {
      return `<div class="${rowClass}"><span class="subitem-text">${s.exercise}</span></div>`;
    }

    const formLink = FORM_LINKS[s.exercise]
      ? `<a href="${FORM_LINKS[s.exercise].url}" target="_blank" rel="noopener noreferrer"
           class="form-link" style="color:${day.accent};border-color:${day.accent}"
           title="${FORM_LINKS[s.exercise].label}">FORM ↗</a>`
      : "";

    const bellTag = s.bell
      ? `<span class="bell-tag">${s.bell}</span>` : "";

    const cue = s.cue
      ? `<div class="ex-cue">${s.cue}</div>` : "";

    const prescription = s.prescription
      ? `<div class="ex-prescription" style="color:${day.accent}">${s.prescription}</div>` : "";

    return `<div class="${rowClass}">
      <div>
        <div class="ex-name-row">
          <span class="ex-num" style="color:${day.accent}">${String(exNum).padStart(2,"0")}</span>
          <span class="ex-name">${s.exercise}</span>
          ${bellTag}${formLink}
        </div>
        ${cue}
      </div>
      ${prescription}
    </div>`;
  }).join("");

  container.innerHTML = `
    <div class="day-desc-row">
      <div class="accent-bar" style="background:${day.accent}"></div>
      <div>
        <div class="day-theme-title">${day.theme}</div>
        <div class="day-theme-desc">${day.description}</div>
      </div>
    </div>

    <div class="warmup-box">
      <div class="section-label">WARMUP — 5 MIN</div>
      ${warmupItems}
    </div>

    <div class="block-tabs">${blockTabs}</div>

    <div class="exercise-list">${exerciseRows}</div>
  `;
}

function renderProgression() {
  const grid = document.getElementById("progression-grid");
  grid.innerHTML = PROGRESSION.map(p => `
    <div class="prog-card" style="border-left-color:${p.color}">
      <div class="prog-header">
        <span class="prog-phase" style="color:${p.color}">${p.phase}</span>
        <span class="prog-focus">${p.focus}</span>
      </div>
      <div class="prog-text">${p.prescription}</div>
    </div>`).join("");
}

function renderPrinciples() {
  const grid = document.getElementById("principles-grid");
  grid.innerHTML = PRINCIPLES.map(p => `
    <div class="principle-card">
      <div class="principle-icon">${p.icon}</div>
      <div class="principle-title">${p.title}</div>
      <div class="principle-body">${p.body}</div>
    </div>`).join("");
}

// ── INIT ─────────────────────────────────────────────────────────────────────
render();

// Style active toggle button on load
document.getElementById("btn3").style.background = DAYS[0].accent;
document.getElementById("btn3").style.borderColor = DAYS[0].accent;
document.getElementById("btn3").style.color = "#1a1a1a";
</script>
</body>
</html>
